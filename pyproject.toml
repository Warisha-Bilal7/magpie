[project]
name = "cdesk"
version = "0.1.0"
description = "Content Desk — a local-first work journal and posting desk"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "ollama>=0.4",
    "pydantic>=2",
    "typer>=0.12",
    "streamlit>=1.37",
    "numpy>=1.26",
    "pandas>=2",
    "jinja2>=3.1",
    "psutil>=5",
    "watchdog>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desk = "cdesk.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
